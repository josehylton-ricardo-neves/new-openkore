# ============================================================
# ONLINE WATCHER
# ============================================================

# 0 = so os bots
# 1 = always
# 2 = manual
activation=2

interval=20
timeout=5

url=https://o-ro.org/rankings?online=1&tier=all&class=all&guild=all&sort=level

# Caminho dentro do container.
output=/shared/online-watch/online_players.json

# Caminho equivalente no Windows host, usado pelo watcherctl.ps1.
host_output=./runtime/online-watch/online_players.json

# 1 = usa ETag/If-None-Match quando disponivel.
etag=1

user_agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36
verbose=1
