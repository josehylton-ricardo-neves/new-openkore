    container_name: vpn-bot10
    hostname: vpn-bot10

    profiles:
      - bot10-console

    environment:
      <<: *vpn-environment
      BOT_NUMBER: "10"
      PREFLIGHT_ROOT: /project
      #FIREWALL_INPUT_PORTS: "6088,5908"

    ports: []

    volumes:
      - type: bind
        source: ./vpn-guard-entrypoint.sh
        target: /checks/vpn-guard-entrypoint.sh
        read_only: true
        bind:
          create_host_path: false

      - type: bind
        source: ./openkore-preflight.sh
        target: /checks/openkore-preflight.sh
        read_only: true
        bind:
          create_host_path: false

      - type: bind
        source: ./instances
        target: /project/instances
        read_only: true
        bind:
          create_host_path: false

      - type: bind
        source: ./vpn
        target: /project/vpn
        read_only: true
        bind:
          create_host_path: false

      - type: bind
        source: ./vpn/vpn-bot10/protonvpn-bot10.conf
        target: /gluetun/wireguard/wg0.conf
        read_only: true
        bind:
          create_host_path: false

    networks:
      - vpn-bot10-net





  # ==========================================================
  # BOT10 - CONSOLE
  # ==========================================================
  bot10-console:
    <<: *openkore-common

    container_name: openkore-bot10-console

    profiles:
      - bot10-console

    stdin_open: true
    tty: true

    network_mode: "service:vpn10"

    depends_on:
      vpn10:
        condition: service_healthy

    environment:
      <<: *bot-environment

      BOT_NAME: bot10
      BOT_NUMBER: "10"
      PREFLIGHT_ROOT: /preflight-project
      OPENKORE_MODE: console

    volumes: *bot10-volumes

    command:
      - /bin/sh
      - /usr/local/bin/openkore-mode
      - console
      
      
      
      
      
      
      

















  # ============================================================
  # VPN EXCLUSIVA DO ONLINE WATCHER
  # ============================================================

  vpn-watcher:
    image: qmcgaw/gluetun:v3.41.1

    container_name: vpn-online-watcher
    hostname: vpn-online-watcher

    profiles:
      - online-watcher

    cap_add:
      - NET_ADMIN

    devices:
      - /dev/net/tun:/dev/net/tun

    restart: unless-stopped

    environment:
      VPN_SERVICE_PROVIDER: custom
      VPN_TYPE: wireguard
      TZ: America/Fortaleza

    volumes:
      - type: bind
        source: ./vpn/vpn-watcher/protonvpn-watcher.conf
        target: /gluetun/wireguard/wg0.conf
        read_only: true
        bind:
          create_host_path: false

    healthcheck:
      test:
        - CMD
        - /gluetun-entrypoint
        - healthcheck
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 6

    networks:
      - vpn-watcher-net

    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "2"


  # ============================================================
  # ONLINE WATCHER
  # ============================================================

  online-watcher:
    image: openkore-runtime-gui:local

    container_name: openkore-online-watcher

    profiles:
      - online-watcher

    restart: unless-stopped

    network_mode: "service:vpn-watcher"

    depends_on:
      vpn-watcher:
        condition: service_healthy

    entrypoint:
      - /usr/bin/tini
      - --
      - /usr/bin/perl
      - /watcher/online-watcher.pl

    environment:
      ONLINE_WATCH_CONFIG: /watcher/online-watcher.conf

    volumes:
      - type: bind
        source: ./online-guard/watcher/online-watcher.pl
        target: /watcher/online-watcher.pl
        read_only: true
        bind:
          create_host_path: false

      - type: bind
        source: ./online-guard/watcher/online-watcher.conf
        target: /watcher/online-watcher.conf
        read_only: true
        bind:
          create_host_path: false

      - type: bind
        source: ./runtime/online-watch
        target: /shared/online-watch
        bind:
          create_host_path: true

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "2"










  
      

