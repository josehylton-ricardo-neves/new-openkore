name: openkore-bot-lab

# ============================================================
# OPENKORE - RUNTIME COMUM
# ============================================================

x-openkore-common: &openkore-common
  image: openkore-runtime-gui:local

  build:
    context: .
    dockerfile: Dockerfile
    target: openkore-runtime

  # Os scripts são bind-mounted e executados via /bin/sh.
  # Isso evita problemas de permissão/CRLF vindos do Windows e
  # permite alterar os scripts sem rebuild.
  entrypoint:
    - /usr/bin/tini
    - --
    - /bin/sh
    - /usr/local/bin/openkore-entrypoint

  restart: "no"

  cap_drop:
    - ALL

  security_opt:
    - no-new-privileges:true

  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

  tmpfs:
    - /tmp:size=256m,mode=1777


x-bot-environment: &bot-environment
  WAIT_FOR_VPN: "true"
  VPN_CHECK_URL: "https://api.ipify.org"
  VPN_WAIT_ATTEMPTS: "30"
  VPN_WAIT_SECONDS: "2"
  TERM: xterm
  LANG: C.UTF-8
  LC_ALL: C.UTF-8


# ============================================================
# GLUETUN - VPN COMUM
# ============================================================

x-vpn-common: &vpn-common
  image: qmcgaw/gluetun:v3.41.1

  # Wrapper local:
  # 1. valida VPN/configs/credenciais;
  # 2. só depois executa /gluetun-entrypoint.
  entrypoint:
    - /bin/sh
    - /checks/vpn-guard-entrypoint.sh

  cap_add:
    - NET_ADMIN

  devices:
    - /dev/net/tun:/dev/net/tun

  restart: unless-stopped

  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

  # Torna explícito o healthcheck do Gluetun.
  # O OpenKore usa depends_on: condition: service_healthy.
  healthcheck:
    test:
      - CMD
      - /gluetun-entrypoint
      - healthcheck
    interval: 5s
    timeout: 5s
    start_period: 10s
    retries: 6


x-vpn-environment: &vpn-environment
  VPN_SERVICE_PROVIDER: custom
  VPN_TYPE: wireguard
  TZ: America/Fortaleza
  FIREWALL_OUTBOUND_SUBNETS: "192.168.65.254/32"
  DNS_REBINDING_PROTECTION_EXEMPT_HOSTNAMES: "host.docker.internal"


# ============================================================
# VOLUMES COMUNS DOS BOTS
# ============================================================

x-bot1-volumes: &bot1-volumes
  - type: bind
    source: ./openkore-preflight.sh
    target: /checks/openkore-preflight.sh
    read_only: true
    bind:
      create_host_path: false

  - type: bind
    source: ./instances
    target: /preflight-project/instances
    read_only: true
    bind:
      create_host_path: false

  - type: bind
    source: ./vpn
    target: /preflight-project/vpn
    read_only: true
    bind:
      create_host_path: false

  - type: bind
    source: ./openkore-entrypoint.sh
    target: /usr/local/bin/openkore-entrypoint
    read_only: true
    bind:
      create_host_path: false

  - type: bind
    source: ./openkore-mode.sh
    target: /usr/local/bin/openkore-mode
    read_only: true
    bind:
      create_host_path: false

  - type: bind
    source: ./dockerMapState.pl
    target: /opt/openkore/plugins/dockerMapState.pl
    read_only: true
    bind:
      create_host_path: false

  - type: bind
    source: ./instances/openkore-bot1
    target: /opt/openkore
    bind:
      create_host_path: false

  - type: volume
    source: xstools-bot1
    target: /opt/openkore/src/auto/XSTools
    volume:
      nocopy: true


