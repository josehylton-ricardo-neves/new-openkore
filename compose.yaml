# ============================================================
# SERVIÇOS
# ============================================================

services:

  # ==========================================================
  # VPN 1
  # ==========================================================
  vpn1:
    <<: *vpn-common

    container_name: vpn-bot1
    hostname: vpn-bot1

    profiles:
      - bot1-wx
      - bot1-console
      - bot1-map

    environment:
      <<: *vpn-environment
      BOT_NUMBER: "1"
      PREFLIGHT_ROOT: /project
      FIREWALL_INPUT_PORTS: "6080,5900"

    ports:
      - "127.0.0.1:6080:6080"
      - "127.0.0.1:6081:5900"

    volumes:
      # Guardas executados ANTES do Gluetun.
      - type: bind
        source: ./vpn-guard-entrypoint.sh
        target: /checks/vpn-guard-entrypoint.sh
        read_only: true
        bind:
          create_host_path: false

      - type: bind
        source: ./openkore-preflight.sh
        target: /checks/openkore-preflight.sh
        read_only: true
        bind:
          create_host_path: false

      # Permite comparar BOT1 x BOT2 sem expor nada nos logs.
      - type: bind
        source: ./instances
        target: /project/instances
        read_only: true
        bind:
          create_host_path: false

      - type: bind
        source: ./vpn
        target: /project/vpn
        read_only: true
        bind:
          create_host_path: false

      # Config WireGuard efetivamente usada pelo Gluetun.
      - type: bind
        source: ./vpn/vpn-bot1/protonvpn-bot1.conf
        target: /gluetun/wireguard/wg0.conf
        read_only: true
        bind:
          create_host_path: false

    networks:
      - vpn-bot1-net


  # ==========================================================
  # BOT1 - WX
  # ==========================================================
  bot1-gui:
    <<: *openkore-common

    container_name: openkore-bot1-gui

    profiles:
      - bot1-wx

    stdin_open: true
    tty: true

    network_mode: "service:vpn1"

    depends_on:
      vpn1:
        condition: service_healthy

    environment:
      <<: *bot-environment
      BOT_NAME: bot1
      BOT_NUMBER: "1"
      PREFLIGHT_ROOT: /preflight-project
      OPENKORE_MODE: wx

      DISPLAY_NUM: "99"
      SCREEN_WIDTH: "1280"
      SCREEN_HEIGHT: "800"
      SCREEN_DEPTH: "24"

      VNC_PORT: "5900"
      VNC_LISTEN: "0.0.0.0"
      NOVNC_PORT: "6080"

    volumes: *bot1-volumes

    command:
      - /bin/sh
      - /usr/local/bin/openkore-mode
      - wx


  # ==========================================================
  # BOT1 - CONSOLE
  # ==========================================================
  bot1-console:
    <<: *openkore-common

    container_name: openkore-bot1-console

    profiles:
      - bot1-console

    stdin_open: true
    tty: true

    network_mode: "service:vpn1"

    depends_on:
      vpn1:
        condition: service_healthy

    environment:
      <<: *bot-environment
      BOT_NAME: bot1
      BOT_NUMBER: "1"
      PREFLIGHT_ROOT: /preflight-project
      OPENKORE_MODE: console

    volumes: *bot1-volumes

    command:
      - /bin/sh
      - /usr/local/bin/openkore-mode
      - console


  # ==========================================================
  # BOT1 - CONSOLE + MAPVIEWER
  # ==========================================================
  bot1-map:
    <<: *openkore-common

    container_name: openkore-bot1-map

    profiles:
      - bot1-map

    stdin_open: true
    tty: true

    network_mode: "service:vpn1"

    depends_on:
      vpn1:
        condition: service_healthy

    environment:
      <<: *bot-environment
      BOT_NAME: bot1
      BOT_NUMBER: "1"
      PREFLIGHT_ROOT: /preflight-project
      OPENKORE_MODE: map

      DISPLAY_NUM: "99"
      SCREEN_WIDTH: "1280"
      SCREEN_HEIGHT: "800"
      SCREEN_DEPTH: "24"

      VNC_PORT: "5900"
      VNC_LISTEN: "0.0.0.0"
      NOVNC_PORT: "6080"

    volumes: *bot1-volumes

    command:
      - /bin/sh
      - /usr/local/bin/openkore-mode
      - map


  # ==========================================================
  # VPN 2
  # ==========================================================
  vpn2:
    <<: *vpn-common

    container_name: vpn-bot2
    hostname: vpn-bot2

    profiles:
      - bot2-wx
      - bot2-console
      - bot2-map

    environment:
      <<: *vpn-environment
      BOT_NUMBER: "2"
      PREFLIGHT_ROOT: /project
      FIREWALL_INPUT_PORTS: "6082,5902"

    ports:
      - "127.0.0.1:6082:6082"
      - "127.0.0.1:6083:5902"

    volumes:
      - type: bind
        source: ./vpn-guard-entrypoint.sh
        target: /checks/vpn-guard-entrypoint.sh
        read_only: true
        bind:
          create_host_path: false

      - type: bind
        source: ./openkore-preflight.sh
        target: /checks/openkore-preflight.sh
        read_only: true
        bind:
          create_host_path: false

      - type: bind
        source: ./instances
