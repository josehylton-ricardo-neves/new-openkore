      BOT_NAME: bot1
      BOT_NUMBER: "1"
      PREFLIGHT_ROOT: /preflight-project
      OPENKORE_MODE: console

    volumes: *bot1-volumes

    command:
      - /bin/sh
      - /usr/local/bin/openkore-mode
      - console


  # ==========================================================
  # BOT1 - CONSOLE + MAPVIEWER
